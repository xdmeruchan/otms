[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Replace YOUR-PROJECT-REF with your Supabase project reference.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://btrkvjlavshssabchhah.supabase.co wss:https://btrkvjlavshssabchhah.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
